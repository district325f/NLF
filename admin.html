<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NLF Admin</title><style>
:root{--navy:#003b6f;--teal:#0b4f6c;--gold:#d4a928;--bg:#eef3f7;--green:#198754;--red:#c0392b}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#233}.wrap{max-width:1180px;margin:auto;padding:22px}.card{background:#fff;border-radius:16px;box-shadow:0 10px 28px #003b6f18;padding:22px;margin-bottom:18px}.login{max-width:420px;margin:8vh auto}.brand{text-align:center}.brand img{width:72px}.brand h1{color:var(--navy);margin:8px 0 0}.brand p{margin:5px;color:#687789}label{font-size:12px;font-weight:700;color:var(--navy);display:block;margin:12px 0 5px}input,select,button{width:100%;padding:11px 12px;border:1px solid #ccd6e0;border-radius:8px;font-size:14px}button{background:var(--navy);color:#fff;border:0;font-weight:700;cursor:pointer}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top .brandline{display:flex;align-items:center;gap:12px}.top img{width:52px}.actions{display:flex;gap:8px}.actions button{width:auto}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:15px;border-radius:12px;background:#f7fafc;border-left:4px solid var(--gold)}.stat b{display:block;font-size:22px;color:var(--navy);margin-top:4px}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{background:var(--teal);color:#fff;padding:10px;text-align:left;white-space:nowrap}td{padding:9px;border-bottom:1px solid #e5ebf0;white-space:nowrap}.badge{padding:4px 8px;border-radius:999px;font-weight:700}.pending{background:#fff3cd;color:#7a5a00}.verified{background:#dff5e8;color:#126b3a}.smallbtn{width:auto;padding:6px 9px;font-size:11px}.usergrid{display:grid;grid-template-columns:2fr 2fr 1fr auto;gap:8px;align-items:end}.hidden{display:none!important}@media(max-width:760px){.filters,.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.actions{flex-direction:column}.usergrid{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body><div class="wrap"><div id="loginCard" class="card login"><div class="brand"><img src="logo.png"><h1>NLF Admin</h1><p>Lions International • District 325 F</p></div><label>Username</label><input id="user"><label>Password</label><input id="pass" type="password"><button onclick="login()" style="margin-top:16px">Login</button><p id="loginMsg"></p></div>
<div id="app" class="hidden"><div class="card top"><div class="brandline"><img src="logo.png"><div><b style="font-size:20px;color:var(--navy)">NLF Contribution Management</b><div id="who" style="font-size:12px;color:#718096"></div></div></div><div class="actions"><button onclick="downloadPdf()">Download PDF</button><button onclick="logout()">Logout</button></div></div>
<div class="card"><div class="filters"><div><label>From</label><input type="date" id="from"></div><div><label>To</label><input type="date" id="to"></div><div><label>Payment</label><select id="payment"><option value="">All</option><option>Cash</option><option>Cheque</option><option>QR</option></select></div><div><label>Status</label><select id="status"><option value="">All</option><option>Pending</option><option>Verified</option></select></div><div><label>Search</label><input id="q" placeholder="Name / Club / Membership / Receipt"></div></div></div>
<div class="stats"><div class="stat">Total Records<b id="sRecords">0</b></div><div class="stat">Total Amount<b id="sTotal">Rs. 0</b></div><div class="stat">Pending<b id="sPending">0</b></div><div class="stat">Verified<b id="sVerified">0</b></div></div>
<div class="card"><div class="tablebox"><table><thead><tr><th>S.N.</th><th>Receipt</th><th>Date</th><th>Name</th><th>Club</th><th>Membership</th><th>Contact</th><th>Amount</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
<div class="card"><h3 style="color:var(--navy);margin-top:0">User Management</h3><div class="usergrid"><div><label>Username</label><input id="newUser"></div><div><label>Password</label><input id="newPass" type="password"></div><div><label>Status</label><select id="newStatus"><option>Active</option><option>Inactive</option></select></div><div><button onclick="saveUser()">Save User</button></div></div><div id="usersList" style="margin-top:12px;font-size:13px"></div></div></div></div>
<script>const API="https://script.google.com/macros/s/AKfycby2smDxtGmgD5WvHIZS4ohE2uMtXvblkfl0FNptzDHkWQjPfnFjkBT_T0jttpnjfQv-/exec";let token=sessionStorage.getItem('nlfToken')||'',allRows=[];if(token)openApp();['from','to','payment','status','q'].forEach(id=>document.getElementById(id)?.addEventListener('input',render));function post(o){return fetch(API,{method:'POST',body:JSON.stringify(o)}).then(r=>r.json())}function login(){post({action:'login',username:user.value,password:pass.value}).then(r=>{if(r.status==='success'){token=r.token;sessionStorage.setItem('nlfToken',token);openApp()}else loginMsg.textContent=r.message})}function openApp(){loginCard.classList.add('hidden');app.classList.remove('hidden');load()}function load(){fetch(API+'?action=adminData&token='+encodeURIComponent(token)).then(r=>r.json()).then(r=>{if(r.status!=='success'){sessionStorage.removeItem('nlfToken');location.reload();return}who.textContent='Logged in as: '+r.username;allRows=r.rows||[];render();loadUsers()})}function filtered(){let f=from.value,t=to.value,p=payment.value,s=status.value,qq=q.value.toLowerCase().trim();return allRows.filter(r=>{let d=(r.date||'').slice(0,10);return(!f||d>=f)&&(!t||d<=t)&&(!p||r.payment===p)&&(!s||r.status===s)&&(!qq||[r.name,r.club,r.membership,r.receipt,r.contact].join(' ').toLowerCase().includes(qq))})}function render(){let rows=filtered(),total=0,pn=0,vn=0;tbody.innerHTML=rows.map((r,i)=>{let n=Number(String(r.amount).replace(/[^0-9.-]/g,''))||0;total+=n;r.status==='Verified'?vn++:pn++;return `<tr><td>${i+1}</td><td>${e(r.receipt)}</td><td>${e(r.date)}</td><td>${e(r.name)}</td><td>${e(r.club)}</td><td>${e(r.membership)}</td><td>${e(r.contact)}</td><td>Rs. ${n.toLocaleString('en-IN')}</td><td>${e(r.payment)}</td><td><span class="badge ${r.status==='Verified'?'verified':'pending'}">${e(r.status)}</span></td><td><button class="smallbtn" onclick="toggleStatus(${r.row},'${r.status==='Verified'?'Pending':'Verified'}')">${r.status==='Verified'?'Set Pending':'Verify'}</button></td></tr>`}).join('');sRecords.textContent=rows.length;sTotal.textContent='Rs. '+total.toLocaleString('en-IN');sPending.textContent=pn;sVerified.textContent=vn}function toggleStatus(row,status){post({action:'verifyPayment',token,row,status}).then(r=>{if(r.status==='success')load();else alert(r.message)})}function logout(){post({action:'logout',token}).finally(()=>{sessionStorage.removeItem('nlfToken');location.reload()})}function saveUser(){post({action:'saveUser',token,username:newUser.value,password:newPass.value,status:newStatus.value}).then(r=>{if(r.status==='success'){newUser.value='';newPass.value='';loadUsers()}else alert(r.message)})}function loadUsers(){fetch(API+'?action=users&token='+encodeURIComponent(token)).then(r=>r.json()).then(r=>{if(r.status==='success')usersList.innerHTML=r.rows.map(x=>`<span style="display:inline-block;padding:7px 10px;margin:3px;border:1px solid #dfe6ed;border-radius:8px"><b>${e(x.username)}</b> • ${e(x.status)}</span>`).join('')})}function downloadPdf(){let filters={from:from.value,to:to.value,payment:payment.value,status:status.value};post({action:'pdfReport',token,filters}).then(r=>{if(r.status!=='success'){alert(r.message);return}let bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0)),blob=new Blob([bytes],{type:'application/pdf'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=r.filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)})}function e(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
