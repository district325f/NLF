     NLF ADMIN SYSTEM
     STABLE / EDITABLE SOURCE
     ============================================================ -->
<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   NLF Admin
  </title>
  <style>
:root {
  --navy:#003b6f;
  --teal:#0b5e75;
  --gold:#d4a928;
  --bg:#eef3f7;
  --green:#198754;
  --red:#c0392b;
  --muted:#687789
}

* {
  box-sizing:border-box
}

body {
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:#233
}

.wrap {
  max-width:1180px;
  margin:auto;
  padding:22px
}

.card {
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 28px #003b6f18;
  padding:22px;
  margin-bottom:18px
}

.login {
  max-width:420px;
  margin:8vh auto
}

.brand {
  text-align:center
}

.brand img {
  width:72px
}

.brand h1 {
  color:var(--navy);
  margin:8px 0 0
}

.brand p {
  margin:5px;
  color:var(--muted)
}

label {
  font-size:12px;
  font-weight:700;
  color:var(--navy);
  display:block;
  margin:12px 0 5px
}

input,select,button {
  width:100%;
  padding:11px 12px;
  border:1px solid #ccd6e0;
  border-radius:8px;
  font-size:14px
}

button {
  background:var(--navy);
  color:#fff;
  border:0;
  font-weight:700;
  cursor:pointer
}

button:disabled {
  opacity:.6;
  cursor:not-allowed
}

.secondary {
  background:#fff;
  color:var(--navy);
  border:1px solid #b9c8d7
}

.top {
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center
}

.top .brandline {
  display:flex;
  align-items:center;
  gap:12px
}

.top img {
  width:52px
}

.actions {
  display:flex;
  gap:8px
}

.actions button {
  width:auto
}

.filters {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  align-items:end
}

.stats {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.stat {
  padding:15px;
  border-radius:12px;
  background:#f7fafc;
  border-left:4px solid var(--gold)
}

.stat b {
  display:block;
  font-size:22px;
  color:var(--navy);
  margin-top:4px
}

.tablebox {
  overflow:auto
}

table {
  width:100%;
  border-collapse:collapse;
  font-size:12px
}

th {
  background:var(--teal);
  color:#fff;
  padding:10px;
  text-align:left;
  white-space:nowrap
}

td {
  padding:9px;
  border-bottom:1px solid #e5ebf0;
  white-space:nowrap
}

.badge {
  padding:4px 8px;
  border-radius:999px;
  font-weight:700
}

.pending {
  background:#fff3cd;
  color:#7a5a00
}

.verified {
  background:#dff5e8;
  color:#126b3a
}

.smallbtn {
  width:auto;
  padding:6px 9px;
  font-size:11px
}

.editbtn {
  background:#52697f
}

.usergrid {
  display:grid;
  grid-template-columns:2fr 2fr 1fr auto;
  gap:8px;
  align-items:end
}

.hidden {
  display:none!important
}

.msg {
  min-height:20px;
  margin:10px 0 0;
  font-size:13px;
  font-weight:600
}

.error {
  color:var(--red)
}

.success {
  color:var(--green)
}

.homeLink {
  display:block;
  text-align:center;
  margin-top:14px;
  color:var(--navy);
  font-weight:700;
  text-decoration:none
}

.modal {
  position:fixed;
  inset:0;
  background:#001b33aa;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:50
}

.modalCard {
  width:min(520px,100%);
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 20px 60px #0004
}

.modalActions {
  display:flex;
  gap:8px;
  margin-top:16px
}

.modalActions button {
  flex:1
}

.preview {
  width:min(1100px,96vw);
  height:90vh;
  overflow:auto
}

.reportSheet {
  background:#fff;
  padding:28px;
  color:#223
}

.reportHead {
  text-align:center;
  border-bottom:2px solid var(--gold);
  padding-bottom:14px;
  margin-bottom:14px
}

.reportHead img {
  width:58px;
  float:left
}

.reportHead h1 {
  font-size:22px;
  color:var(--navy);
  margin:0
}

.reportHead h2 {
  font-size:15px;
  color:var(--navy);
  margin:5px
}

.reportHead h3 {
  font-size:17px;
  color:#9b7400;
  margin:5px
}

.reportMeta {
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:12px;
  margin:12px 0
}

.reportTable {
  font-size:10px
}

.reportTable th {
  background:var(--navy)
}

.reportTotal {
  margin-top:15px;
  padding:12px;
  background:#fff8df;
  border-left:4px solid var(--gold);
  font-weight:700;
  color:var(--navy)
}

.reportFooter {
  text-align:center;
  margin-top:24px;
  font-size:11px;
  color:#667
}

.editGrid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.editGrid .wide {
  grid-column:1/-1
}

@media(max-width:760px) {
  .filters,.stats {
    grid-template-columns:1fr 1fr
  }

  .top {
    align-items:flex-start;
    flex-direction:column
  }

  .actions {
    flex-wrap:wrap
  }

  .usergrid,.editGrid {
    grid-template-columns:1fr
  }

  .wrap {
    padding:10px
  }

  .reportMeta {
    display:block
  }

  .reportHead img {
    float:none;
    margin-bottom:8px
  }

}
</style>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
 <body>
  <div class="wrap">
   <div class="card login" id="loginCard">
    <div class="brand">
     <img src="logo.png"/>
     <h1>
      NLF Admin
     </h1>
     <p>
      Lions International • District 325 F
     </p>
    </div>
    <label>
     Username
    </label>
    <input autocomplete="username" id="user"/>
    <label>
     Password
    </label>
    <input autocomplete="current-password" id="pass" type="password"/>
    <button id="loginBtn" onclick="login()" style="margin-top:16px">
     Login
    </button>
    <p class="msg" id="loginMsg">
    </p>
    <a class="homeLink" href="./">
     ← Back to Home
    </a>
   </div>
   <div class="hidden" id="app">
    <div class="card top">
     <div class="brandline">
      <img src="logo.png"/>
      <div>
       <b style="font-size:20px;color:var(--navy)">
        NLF Contribution Management
       </b>
       <div id="who" style="font-size:12px;color:#718096">
       </div>
      </div>
     </div>
     <div class="actions">
      <button class="secondary" onclick="goHome()">
       Home
      </button>
      <button onclick="previewPdf()">
       View PDF
      </button>
      <button onclick="logout()">
       Logout
      </button>
     </div>
    </div>
    <div class="card">
     <div class="filters">
      <div>
       <label>
        From
       </label>
       <input id="from" type="date"/>
      </div>
      <div>
       <label>
        To
       </label>
       <input id="to" type="date"/>
      </div>
      <div>
       <label>
        Payment
       </label>
       <select id="payment">
        <option value="">
         All
        </option>
        <option>
         Cash
        </option>
        <option>
         Cheque
        </option>
        <option>
         QR
        </option>
       </select>
      </div>
      <div>
       <label>
        Status
       </label>
       <select id="status">
        <option value="">
         All
        </option>
        <option>
         Pending
        </option>
        <option>
         Verified
        </option>
       </select>
      </div>
      <div>
       <label>
        Search
       </label>
       <input id="q" placeholder="Name / Club / Membership / Receipt"/>
      </div>
     </div>
    </div>
    <div class="stats">
     <div class="stat">
      Total Records
      <b id="sRecords">
       0
      </b>
     </div>
     <div class="stat">
      Total Amount
      <b id="sTotal">
       Rs. 0
      </b>
     </div>
     <div class="stat">
      Pending
      <b id="sPending">
       0
      </b>
     </div>
     <div class="stat">
      Verified
      <b id="sVerified">
       0
      </b>
     </div>
    </div>
    <div class="card">
     <div class="tablebox">
      <table>
       <thead>
        <tr>
         <th>
          S.N.
         </th>
         <th>
          Receipt
         </th>
         <th>
          Date
         </th>
         <th>
          Name
         </th>
         <th>
          Club
         </th>
         <th>
          Membership
         </th>
         <th>
          Contact
         </th>
         <th>
          Amount
         </th>
         <th>
          Payment
         </th>
         <th>
          Status
         </th>
         <th>
          Action
         </th>
        </tr>
       </thead>
       <tbody id="tbody">
       </tbody>
      </table>
     </div>
    </div>
    <div class="card">
     <h3 style="color:var(--navy);margin-top:0">
      User Management
     </h3>
     <div class="usergrid">
      <div>
       <label>
        Username
       </label>
       <input id="newUser"/>
      </div>
      <div>
       <label>
        Password
       </label>
       <input id="newPass" placeholder="Required for new user; optional when updating" type="password"/>
      </div>
      <div>
       <label>
        Status
       </label>
       <select id="newStatus">
        <option>
         Active
        </option>
        <option>
         Inactive
        </option>
       </select>
      </div>
      <div>
       <button id="saveUserBtn" onclick="saveUser()">
        Save User
       </button>
      </div>
     </div>
     <div class="msg" id="userMsg">
     </div>
     <div id="usersList" style="margin-top:12px;font-size:13px">
     </div>
    </div>
   </div>
  </div>
  <div class="modal hidden" id="editModal">
   <div class="modalCard">
    <h3 style="margin-top:0;color:var(--navy)">
     Edit Contribution
    </h3>
    <div id="editIdentity" style="font-size:13px;color:#667;margin-bottom:8px">
    </div>
    <div class="editGrid">
     <div>
      <label>
       Amount
      </label>
      <input id="editAmount" inputmode="decimal"/>
     </div>
     <div>
      <label>
       Payment Type
      </label>
      <select id="editPayment">
       <option>
        Cash
       </option>
       <option>
        Cheque
       </option>
       <option>
        QR
       </option>
      </select>
     </div>
     <div class="wide">
      <label>
       Status
      </label>
      <select id="editStatus">
       <option>
        Pending
       </option>
       <option>
        Verified
       </option>
      </select>
     </div>
    </div>
    <div class="msg" id="editMsg">
    </div>
    <div class="modalActions">
     <button class="secondary" onclick="closeEdit()">
      Cancel
     </button>
     <button id="editSaveBtn" onclick="saveEdit()">
      Save Changes
     </button>
    </div>
   </div>
  </div>
  <div class="modal hidden" id="pdfModal">
   <div class="modalCard preview">
    <div class="modalActions" style="margin-top:0;margin-bottom:12px">
     <button class="secondary" onclick="closePdf()">
      Close
     </button>
     <button onclick="printPdf()">
      Print / Save PDF
     </button>
     <button onclick="downloadPdfDirect()">
      Download PDF
     </button>
    </div>
    <div id="reportContent">
    </div>
   </div>
  </div>
  <script>
const API="https://script.google.com/macros/s/AKfycby2smDxtGmgD5WvHIZS4ohE2uMtXvblkfl0FNptzDHkWQjPfnFjkBT_T0jttpnjfQv-/exec";
let token=sessionStorage.getItem('nlfToken')||'',
allRows=[],
editingRow=null;
const $=id=>document.getElementById(id);
['from','to','payment','status','q'].forEach(id=>$(id)?.addEventListener('input',render));
$('pass').addEventListener('keydown',e=> {
  if(e.key==='Enter')login()
});
if(token)openApp();
function post(o) {
  return fetch(API, {
    method:'POST',headers: {
      'Content-Type':'text/plain;charset=utf-8'
    },body:JSON.stringify(o)
  }).then(async r=> {
    let t=await r.text();try {
      return JSON.parse(t)
    }catch(e) {
      throw new Error('Invalid server response')
    }
  })
}
function setMsg(id,msg,type='error') {
  let x=$(id);
  x.textContent=msg||'';
  x.className='msg '+(msg?type:'')
}
function busy(btn,on,text) {
  if(!btn)return;
  if(on) {
    btn.dataset.old=btn.textContent;
    btn.disabled=true;
    btn.textContent=text||'Processing...'
  }else {
    btn.disabled=false;
    btn.textContent=btn.dataset.old||btn.textContent
  }
}
async function login() {
  let u=$('user').value.trim(),
  p=$('pass').value;
  if(!u||!p) {
    setMsg('loginMsg','Please enter username and password.');
    return
  }
  busy($('loginBtn'),true,'Checking...');
  setMsg('loginMsg','');
  try {
    let r=await post( {
      action:'login',username:u,password:p
    });
    if(r.status==='success') {
      token=r.token;
      sessionStorage.setItem('nlfToken',token);
      setMsg('loginMsg','Login successful.','success');
      openApp()
    }else setMsg('loginMsg',r.message==='User is inactive'?'Your account is inactive. Please contact administrator.':(r.message||'Invalid Username or Password.'))
  }catch(e) {
    setMsg('loginMsg','Unable to connect. Please try again.')
  }finally {
    busy($('loginBtn'),false)
  }
}
function openApp() {
  $('loginCard').classList.add('hidden');
  $('app').classList.remove('hidden');
  load()
}
async function load() {
  try {
    let r=await fetch(API+'?action=adminData&token='+encodeURIComponent(token)).then(x=>x.json());
    if(r.status!=='success') {
      sessionStorage.removeItem('nlfToken');
      token='';
      $('app').classList.add('hidden');
      $('loginCard').classList.remove('hidden');
      setMsg('loginMsg','Session expired. Please login again.');
      return
    }
    $('who').textContent='Logged in as: '+r.username;
    allRows=r.rows||[];
    render();
    loadUsers()
  }catch(e) {
    alert('Unable to load admin data. Please refresh and try again.')
  }
}
function filtered() {
  let f=$('from').value,
  t=$('to').value,
  p=$('payment').value,
  s=$('status').value,
  qq=$('q').value.toLowerCase().trim();
  return allRows.filter(r=> {
    let dt=parseDate(r.date),d=dt?localYmd(dt):'';return(!f||d>=f)&&(!t||d<=t)&&(!p||r.payment===p)&&(!s||r.status===s)&&(!qq||[r.name,r.club,r.membership,r.receipt,r.contact].join(' ').toLowerCase().includes(qq))
  })
}
function parseDate(v) {
  if(!v)return null;
  let d=new Date(v);
  if(!isNaN(d))return d;
  let m=String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m?new Date(+m[3],+m[1]-1,+m[2]):null
}
function localYmd(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
}
function render() {
  let rows=filtered(),
  total=0,
  pn=0,
  vn=0;
  $('tbody').innerHTML=rows.map((r,i)=> {
    let n=num(r.amount);total+=n;r.status==='Verified'?vn++:pn++;return `<tr><td>${i+1}</td><td>${e(r.receipt)}</td><td>${e(r.date)}</td><td>${e(r.name)}</td><td>${e(r.club)}</td><td>${e(r.membership)}</td><td>${e(r.contact)}</td><td>Rs. ${n.toLocaleString('en-IN')}</td><td>${e(r.payment)}</td><td><span class="badge ${r.status==='Verified'?'verified':'pending'}">${e(r.status)}</span></td><td><button class="smallbtn editbtn" onclick="openEdit(${r.row})">Edit</button> <button class="smallbtn" onclick="toggleStatus(this,${r.row},'${r.status==='Verified'?'Pending':'Verified'}')">${r.status==='Verified'?'Set Pending':'Verify'}</button></td></tr>`
  }).join('');
  $('sRecords').textContent=rows.length;
  $('sTotal').textContent='Rs. '+total.toLocaleString('en-IN');
  $('sPending').textContent=pn;
  $('sVerified').textContent=vn
}
async function toggleStatus(btn,row,status) {
  if(!confirm('Change payment status to '+status+'?'))return;
  busy(btn,true,'Saving...');
  try {
    let r=await post( {
      action:'verifyPayment',token,row,status
    });
    if(r.status==='success') {
      await load()
    }else alert(r.message||'Unable to update status.')
  }catch(e) {
    alert('Unable to update status. Please try again.')
  }finally {
    busy(btn,false)
  }
}
function openEdit(row) {
  editingRow=allRows.find(x=>Number(x.row)===Number(row));
  if(!editingRow)return;
  $('editIdentity').textContent=(editingRow.receipt||'')+' • '+editingRow.name+' • '+editingRow.membership;
  $('editAmount').value=editingRow.amount;
  $('editPayment').value=editingRow.payment;
  $('editStatus').value=editingRow.status||'Pending';
  setMsg('editMsg','');
  $('editModal').classList.remove('hidden')
}
function closeEdit() {
  $('editModal').classList.add('hidden');
  editingRow=null
}
async function saveEdit() {
  if(!editingRow)return;
  busy($('editSaveBtn'),true,'Saving...');
  try {
    let r=await post( {
      action:'updateContribution',token,row:editingRow.row,amount:$('editAmount').value,payment:$('editPayment').value,status:$('editStatus').value
    });
    if(r.status==='success') {
      setMsg('editMsg',r.message||'Updated successfully.','success');
      await load();
      setTimeout(closeEdit,500)
    }else setMsg('editMsg',r.message||'Update failed.')
  }catch(e) {
    setMsg('editMsg','Unable to save changes. Please try again.')
  }finally {
    busy($('editSaveBtn'),false)
  }
}
async function logout() {
  if(!confirm('Logout from NLF Admin?'))return;
  try {
    await post( {
      action:'logout',token
    })
  }catch(e) {
  }
  sessionStorage.removeItem('nlfToken');
  token='';
  $('app').classList.add('hidden');
  $('loginCard').classList.remove('hidden');
  $('pass').value='';
  setMsg('loginMsg','Logged out successfully.','success')
}
function goHome() {
  location.href='./'
}
async function saveUser() {
  let username=$('newUser').value.trim();
  if(!username) {
    setMsg('userMsg','Username is required.');
    return
  }
  busy($('saveUserBtn'),true,'Saving...');
  setMsg('userMsg','');
  try {
    let r=await post( {
      action:'saveUser',token,username,password:$('newPass').value,status:$('newStatus').value
    });
    if(r.status==='success') {
      $('newUser').value='';
      $('newPass').value='';
      setMsg('userMsg',r.message||'User saved successfully.','success');
      loadUsers()
    }else setMsg('userMsg',r.message||'Unable to save user.')
  }catch(e) {
    setMsg('userMsg','Unable to save user. Please try again.')
  }finally {
    busy($('saveUserBtn'),false)
  }
}
async function loadUsers() {
  try {
    let r=await fetch(API+'?action=users&token='+encodeURIComponent(token)).then(x=>x.json());
    if(r.status==='success')$('usersList').innerHTML=r.rows.map(x=>`<span onclick="selectUser('${js(x.username)}','${js(x.status)}')" style="display:inline-block;cursor:pointer;padding:7px 10px;margin:3px;border:1px solid #dfe6ed;border-radius:8px"><b>${e(x.username)}</b> • ${e(x.status)}</span>`).join('')
  }catch(e) {
  }
}
function selectUser(u,s) {
  $('newUser').value=u;
  $('newPass').value='';
  $('newStatus').value=s;
  setMsg('userMsg','Selected '+u+'. Change Status and/or enter a new password, then Save User.','success')
}
function previewPdf() {
  let rows=filtered(),
  total=rows.reduce((s,r)=>s+num(r.amount),0),
  now=new Date();
  let meta=[];
  if($('from').value)meta.push('From: '+$('from').value);
  if($('to').value)meta.push('To: '+$('to').value);
  if($('payment').value)meta.push('Payment: '+$('payment').value);
  if($('status').value)meta.push('Status: '+$('status').value);
  $('reportContent').innerHTML=`<div class="reportSheet"><div class="reportHead"><img src="logo.png"><h1>Lions International</h1><h2>District 325 F</h2><h3>Nepal Lions Foundation (NLF) Contribution Report</h3></div><div class="reportMeta"><span>${e(meta.join(' | ')||'All Contribution Records')}</span><span>Generated: ${e(now.toLocaleString())}</span></div><div class="tablebox"><table class="reportTable"><thead><tr><th>S.N.</th><th>Name</th><th>Club Name</th><th>Membership</th><th>Contact</th><th>Amount</th><th>Payment Type</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${
    i+1
  }
  </td><td>${e(r.name)}</td><td>${
    e(r.club)
  }
  </td><td>${e(r.membership)}</td><td>${
    e(r.contact)
  }
  </td><td>Rs. ${num(r.amount).toLocaleString('en-IN')}</td><td>${
    e(r.payment)
  }
  </td></tr>`).join('')}</tbody></table></div><div class="reportTotal">Total Records: ${rows.length} &nbsp;&nbsp; | &nbsp;&nbsp; NLF Total Contribution: Rs. ${total.toLocaleString('en-IN')}</div><div class="reportFooter">Designed by: Nirajan Aryal | Mobile: 9851113811</div></div>`;

/* ============================================================
   DIRECT PDF DOWNLOAD
   Downloads the currently previewed NLF report as A4 Portrait PDF.
   Existing Print / Save PDF behavior remains unchanged.
   ============================================================ */
async function downloadPdfDirect() {
  const rows = filtered();

  if (!rows.length) {
    alert('No contribution data available for PDF.');
    return;
  }

  const button = document.querySelector(
    'button[onclick="downloadPdfDirect()"]'
  );
  const oldText = button ? button.textContent : '';

  if (button) {
    button.disabled = true;
    button.textContent = 'Downloading...';
  }

  try {
    const logoData = await loadPdfLogoJpeg();
    const pdfBytes = buildStandaloneTextPdf(rows, logoData);
    const blob = new Blob(
      [pdfBytes],
      { type: 'application/pdf' }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const now = new Date();

    const fileDate =
      now.getFullYear() + '-' +
      String(now.getMonth() + 1).padStart(2, '0') + '-' +
      String(now.getDate()).padStart(2, '0');

    link.href = url;
    link.download =
      'NLF_Contribution_Report_' +
      fileDate +
      '.pdf';

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 1500);
  } catch (error) {
    console.error('Direct PDF download failed:', error);
    alert('Unable to create PDF. Please try again.');
  } finally {
    if (button) {
      button.disabled = false;
      button.textContent = oldText || 'Download PDF';
    }
  }
}


/* ============================================================
   STANDALONE TEXT PDF GENERATOR
   ------------------------------------------------------------
   - No CDN
   - No jsPDF
   - No html2canvas
   - No image/screenshot conversion
   - Real selectable PDF text
   - Real vector table lines/backgrounds
   ============================================================ */

async function loadPdfLogoJpeg() {
  try {
    const response = await fetch(
      'logo.png',
      { cache: 'force-cache' }
    );

    if (!response.ok) {
      return null;
    }

    const blob = await response.blob();
    const bitmap = await createImageBitmap(blob);

    const canvas = document.createElement('canvas');
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;

    const context = canvas.getContext('2d');

    // White background keeps transparent PNG areas clean in PDF.
    context.fillStyle = '#FFFFFF';
    context.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    context.drawImage(bitmap, 0, 0);

    const jpegBlob = await new Promise(function(resolve) {
      canvas.toBlob(
        resolve,
        'image/jpeg',
        0.94
      );
    });

    if (!jpegBlob) {
      return null;
    }

    const bytes = new Uint8Array(
      await jpegBlob.arrayBuffer()
    );

    let binary = '';

    for (let i = 0; i < bytes.length; i++) {
      binary += String.fromCharCode(bytes[i]);
    }

    return {
      binary: binary,
      width: canvas.width,
      height: canvas.height
    };
  } catch (error) {
    console.warn('PDF logo could not be loaded:', error);
    return null;
  }
}


function buildStandaloneTextPdf(rows, logoData) {
  const PAGE_W = 595.28;
  const PAGE_H = 841.89;

  const LEFT = 24;
  const RIGHT = 24;
  const TOP = 54;
  const BOTTOM = 48;

  const headerY = 675;
  const rowHeight = 25;

  const columns = [
    { title: 'S.N.', width: 34, align: 'center' },
    { title: 'Name', width: 108, align: 'left' },
    { title: 'Club Name', width: 123, align: 'left' },
    { title: 'Membership', width: 78, align: 'left' },
    { title: 'Contact', width: 78, align: 'left' },
    { title: 'Amount', width: 76, align: 'right' },
    { title: 'Payment', width: 50, align: 'left' }
  ];

  const tableWidth = columns.reduce(function(sum, col) {
    return sum + col.width;
  }, 0);

  const pageRows = Math.max(
    1,
    Math.floor((headerY - BOTTOM - 44) / rowHeight)
  );

  const pages = [];

  for (let start = 0; start < rows.length; start += pageRows) {
    pages.push(rows.slice(start, start + pageRows));
  }

  if (!pages.length) {
    pages.push([]);
  }

  const objects = [];
  const pageObjectNumbers = [];
  const contentObjectNumbers = [];

  // Object 1: Catalog
  objects.push(
    '<< /Type /Catalog /Pages 2 0 R >>'
  );

  // Object 2 is filled after page objects are allocated.
  objects.push('');

  // Object 3: Regular Helvetica
  objects.push(
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'
  );

  // Object 4: Bold Helvetica
  objects.push(
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'
  );

  // Object 5: Lions logo (same logo.png used by the website).
  if (logoData && logoData.binary) {
    objects.push(
      '<< /Type /XObject ' +
      '/Subtype /Image ' +
      '/Width ' + logoData.width + ' ' +
      '/Height ' + logoData.height + ' ' +
      '/ColorSpace /DeviceRGB ' +
      '/BitsPerComponent 8 ' +
      '/Filter /DCTDecode ' +
      '/Length ' + logoData.binary.length + ' >>\n' +
      'stream\n' +
      logoData.binary +
      '\nendstream'
    );
  }

  pages.forEach(function(pageRowsData, pageIndex) {
    const pageObjectNumber = objects.length + 1;
    const contentObjectNumber = pageObjectNumber + 1;

    pageObjectNumbers.push(pageObjectNumber);
    contentObjectNumbers.push(contentObjectNumber);

    const stream = buildPdfPageStream(
      pageRowsData,
      pageIndex,
      pages.length,
      rows,
      columns,
      tableWidth,
      LEFT,
      PAGE_W,
      PAGE_H,
      headerY,
      rowHeight,
      logoData
    );

    objects.push(
      '<< /Type /Page ' +
      '/Parent 2 0 R ' +
      '/MediaBox [0 0 ' + PAGE_W + ' ' + PAGE_H + '] ' +
      '/Resources << ' +
      '/Font << /F1 3 0 R /F2 4 0 R >> ' +
      (logoData && logoData.binary
        ? '/XObject << /Im1 5 0 R >> '
        : '') +
      '>> ' +
      '/Contents ' + contentObjectNumber + ' 0 R ' +
      '>>'
    );

    objects.push(
      '<< /Length ' + byteLengthLatin1(stream) + ' >>\n' +
      'stream\n' +
      stream +
      '\nendstream'
    );
  });

  objects[1] =
    '<< /Type /Pages /Count ' +
    pageObjectNumbers.length +
    ' /Kids [' +
    pageObjectNumbers.map(function(n) {
      return n + ' 0 R';
    }).join(' ') +
    '] >>';

  return assemblePdf(objects);
}


function buildPdfPageStream(
  pageRowsData,
  pageIndex,
  totalPages,
  allRows,
  columns,

  left,
  pageWidth,
  pageHeight,

  pdfText(

    false,
    'left',
    [0.294, 0.333, 0.388]

  pdfText(

    pageHeight - 130,

  /* ---------- Table Header ---------- */

  let x = left;

  /* ---------- Table Rows ---------- */

  let y = headerY - rowHeight;

  pageRowsData.forEach(function(row, localIndex) {
    const globalIndex =
      (pageIndex * Math.max(1, Math.floor((headerY - 48 - 44) / rowHeight))) +
      localIndex +

    if (localIndex % 2 === 1) {
      pdfFillRect(

    const amount = num(row.amount);

    const values = [

  /* ---------- Summary on Final Page ---------- */

  if (pageIndex === totalPages - 1) {
    const totalAmount = allRows.reduce(function(sum, row) {

    let summaryY = y - 10;

  pdfText(

    24,
    7.2,

    'right',
    [0.392, 0.455, 0.545]
  );

  return commands.join('\n');
}


function pdfText(
  commands,
  text,
  x,
  y,
  size,
  bold,
  align,
  rgb
) {
  const value = escapePdfText(String(text || ''));
  const estimatedWidth =
    estimatePdfTextWidth(String(text || ''), size, bold);

  let drawX = x;

  if (align === 'center') {
    drawX = x - (estimatedWidth / 2);
  } else if (align === 'right') {
    drawX = x - estimatedWidth;
  }

  commands.push(
    rgb[0] + ' ' + rgb[1] + ' ' + rgb[2] + ' rg'
  );

  commands.push(
    'BT ' +
    '/' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf ' +
    '1 0 0 1 ' + drawX.toFixed(2) + ' ' + y.toFixed(2) + ' Tm ' +
    '(' + value + ') Tj ET'
  );
}


function pdfFillRect(commands, x, y, width, height, rgb) {
  commands.push(
    rgb[0] + ' ' + rgb[1] + ' ' + rgb[2] + ' rg'
  );

  commands.push(
    x + ' ' + y + ' ' + width + ' ' + height + ' re f'
  );
}


function safePdfCell(value) {
  return String(value == null ? '' : value)
    .replace(/\s+/g, ' ')
    .trim();
}


function fitPdfText(text, maxWidth, fontSize) {
  const value = safePdfCell(text);

  if (estimatePdfTextWidth(value, fontSize, false) <= maxWidth) {
    return value;
  }

  let shortened = value;

  while (
    shortened.length > 3 &&
    estimatePdfTextWidth(
      shortened + '...',
      fontSize,
      false
    ) > maxWidth
  ) {
    shortened = shortened.slice(0, -1);
  }

  return shortened + '...';
}


function estimatePdfTextWidth(text, fontSize, bold) {
  const factor = bold ? 0.54 : 0.50;

  return String(text || '').length * fontSize * factor;
}


function escapePdfText(text) {
  return String(text || '')
    .replace(/\\/g, '\\\\')
    .replace(/\(/g, '\\(')
    .replace(/\)/g, '\\)')
    .replace(/[^\x20-\x7E]/g, '?');
}


function byteLengthLatin1(text) {
  return String(text).length;
}


function assemblePdf(objects) {
  let pdf = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  const offsets = [0];

  objects.forEach(function(objectBody, index) {
    offsets.push(pdf.length);

    pdf +=
      (index + 1) +
      ' 0 obj\n' +
      objectBody +
      '\nendobj\n';
  });

  const xrefOffset = pdf.length;

  pdf +=
    'xref\n' +
    '0 ' + (objects.length + 1) + '\n' +
    '0000000000 65535 f \n';

  for (let i = 1; i <= objects.length; i++) {
    pdf +=
      String(offsets[i]).padStart(10, '0') +
      ' 00000 n \n';
  }

  pdf +=
    'trailer\n' +
    '<< /Size ' + (objects.length + 1) + ' /Root 1 0 R >>\n' +
    'startxref\n' +
    xrefOffset +
    '\n%%EOF';

  const bytes = new Uint8Array(pdf.length);

  for (let i = 0; i < pdf.length; i++) {
    bytes[i] = pdf.charCodeAt(i) & 0xFF;
  }

  return bytes;
}


function num(v) {
  return Number(String(v??'').replace(/[^0-9.-]/g,''))||0
}
function e(v) {
  return String(v??'').replace(/[&<>"']/g,m=>( {
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]))
}
function js(v) {
  return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")
}
